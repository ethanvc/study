<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Argo Proxy</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <div id="view-main" class="view active">
        <div class="switch-row">
            <span class="text">启用代理路由</span>
            <div id="switch" class="switch" role="button" aria-checked="true" tabindex="0"></div>
        </div>
        <button type="button" id="btn-host-list" class="menu-item" aria-label="Host 列表">
            <span class="label">Host 列表</span>
            <span id="host-count" class="meta">0 条</span>
            <span class="arrow">›</span>
        </button>
        <button type="button" id="btn-settings" class="menu-item" aria-label="设置">
            <span class="label">设置</span>
        </button>
    </div>

    <div id="view-sub" class="view">
        <div class="sub-header">
            <button type="button" class="back-btn" id="btn-back" aria-label="返回">‹</button>
            <span class="sub-title">Host 列表</span>
        </div>
        <div id="host-list-container" class="host-list"></div>
        <div id="host-list-empty" class="empty-state" style="display:none;">
            暂无规则<br />
            <span class="link" id="link-to-settings">去设置页添加</span>
        </div>
    </div>

    <script src="../shared/storage-schema.js"></script>
    <script src="popup.js"></script>
</body>

</html>
