# ClickHouse 集群：3 节点（1 分片 3 副本），测试用无持久化
# 节点 1 同时跑 Keeper，节点 2/3 连接该 Keeper
# mem_limit 避免多节点争内存被 OOM (exit 137)

services:
  clickhouse-1:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse-1
    mem_limit: 1g
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
      - "9181:9181"   # Keeper
    volumes:
      - ./config/clickhouse-1:/etc/clickhouse-server/config.d
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1   # default 无密码，可从主机访问（仅测试用）
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  clickhouse-2:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse-2
    mem_limit: 1g
    depends_on:
      clickhouse-1: { condition: service_healthy }
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ./config/clickhouse-2:/etc/clickhouse-server/config.d
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1   # default 无密码，可从主机访问（仅测试用）
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  clickhouse-3:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse-3
    mem_limit: 1g
    depends_on:
      clickhouse-1: { condition: service_healthy }
    ports:
      - "8125:8123"
      - "9002:9000"
    volumes:
      - ./config/clickhouse-3:/etc/clickhouse-server/config.d
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1   # default 无密码，可从主机访问（仅测试用）
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 3
