# ============================================
# PostgreSQL 主库配置 (postgres-1)
# ============================================

# 连接设置
listen_addresses = '*'
port = 5432
max_connections = 200

# ========== WAL 和复制配置 ==========

# WAL 级别（replica 支持流复制）
wal_level = replica

# 最大 WAL 发送进程数（从库数量 + 备用）
max_wal_senders = 10

# 最大复制槽数量
max_replication_slots = 10

# 保留的 WAL 大小（防止从库落后太多）
wal_keep_size = 1GB

# ========== 同步复制配置（生产环境关键） ==========

# 同步提交模式
# on = 等待 WAL 写入本地磁盘
# remote_write = 等待从库收到 WAL
# remote_apply = 等待从库应用 WAL（最安全）
synchronous_commit = remote_apply

# 同步从库列表
# FIRST 1 表示至少等待列表中第一个可用的从库确认
# (postgres-2, postgres-3) 是从库的 application_name
synchronous_standby_names = 'FIRST 1 (postgres-2, postgres-3)'

# ========== 热备查询 ==========
hot_standby = on
hot_standby_feedback = on

# ========== 数据持久化（生产必需） ==========

# 每次提交都刷盘
fsync = on
synchronous_commit = remote_apply
full_page_writes = on

# WAL 写入时机
wal_writer_delay = 200ms
wal_buffers = 64MB

# checkpoint 配置
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 1GB

# ========== 日志配置 ==========
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_min_duration_statement = 1000

# ========== 内存配置 ==========
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 128MB
