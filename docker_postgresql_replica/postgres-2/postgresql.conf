# ============================================
# PostgreSQL 从库配置 (postgres-2)
# ============================================

# 连接设置
listen_addresses = '*'
port = 5432
max_connections = 200

# ========== WAL 和复制配置 ==========

# WAL 级别（从库也设置为 replica，便于级联复制或故障切换）
wal_level = replica

# 最大 WAL 发送进程数（级联复制或故障切换时使用）
max_wal_senders = 10

# 最大复制槽数量
max_replication_slots = 10

# 保留的 WAL 大小
wal_keep_size = 1GB

# ========== 热备查询 ==========
hot_standby = on
hot_standby_feedback = on

# ========== 主库连接配置 ==========

# 主库连接信息
primary_conninfo = 'host=postgres-1 port=5432 user=repl_user password=123456 application_name=postgres-2'

# 使用复制槽（确保不会丢失 WAL）
primary_slot_name = 'replica_slot_2'

# ========== 数据持久化（生产必需） ==========
fsync = on
full_page_writes = on

# WAL 配置
wal_writer_delay = 200ms
wal_buffers = 64MB

# checkpoint 配置
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 1GB

# ========== 日志配置 ==========
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_min_duration_statement = 1000

# ========== 内存配置 ==========
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 128MB
